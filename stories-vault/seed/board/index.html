<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The stories board</title>
<style>
  /* Everything inline: a vault app cannot load a stylesheet or a script by path. */
  :root{--paper:#F7F6F2;--card:#fff;--ink:#0D0D0C;--muted:#5b5a56;--faint:#8a8985;--border:#e4e2dc;--green:#1A7F5A;--greenBg:#e8f4ee;--gold:#B45309;--goldBg:#fbf1e6;--red:#C0392B;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  header{padding:22px 24px 10px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--green)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:12px 24px 40px}
  .col{background:rgba(0,0,0,.025);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:200px}
  .col h2{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
  .col h2 b{color:var(--green)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .card .id{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .card .t{font-weight:600;margin:2px 0 4px;color:var(--ink)}
  .card .who{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .card .on{margin-top:6px;font-size:12.5px;color:var(--gold);background:var(--goldBg);border-radius:6px;padding:4px 8px}
  .card .from{font-size:12px;color:var(--muted)}
  .card.done .t{color:var(--muted);text-decoration:line-through}
  .card.high{border-left:3px solid var(--green)}
  .card.low{opacity:.75}
  footer{padding:0 24px 30px;font-size:12.5px;color:var(--faint);max-width:760px}
  .log{padding:0 24px 24px;max-width:860px}.log h2{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .rev{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:10px 12px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}.rev b{display:block;color:var(--ink);font-family:var(--mono);font-size:11px;margin-bottom:4px}
  @media (max-width:900px){.board{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>The stories board, <span>derived.</span></h1>
  <p class="meta" id="meta">reading board.json…</p>
</header>
<main class="board" id="board"></main>
<section class="log" id="log"></section>
<footer>Nothing on this board is dragged. A card is an issue file in an agent's <code>mail/&lt;agent&gt;/issues/</code> folder, or a message still waiting in a mailroom; it moves because a file moved. Regenerated by @Publisher on each check-in.</footer>
<script>

const LABEL = { requested: 'Requested', open: 'Open', blocked: 'Blocked', done: 'Done' };
async function getData() {
  try { if (window.sg && sg.vfs && sg.vfs.readText) { const t = await sg.vfs.readText('board/board.json'); const j = JSON.parse(t); if (j && j.cards) return j; } } catch (e) {}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    const h = el('h2'); h.appendChild(el('span', null, LABEL[c] || c)); h.appendChild(el('b', null, String(mine.length))); col.appendChild(h);
    for (const k of mine) {

      card.appendChild(el('div', 'id', k.id + (k.priority && k.priority !== 'normal' ? ' · ' + k.priority : '')));
      card.appendChild(el('div', 't', k.title));
      card.appendChild(el('div', 'who', (c === 'requested' ? 'for ' : '') + k.owner + (k.from ? ' · from ' + k.from : '')));
      if (k.blocked_on) card.appendChild(el('div', 'on', 'waiting on ' + k.blocked_on));
      col.appendChild(card);
    }
    board.appendChild(col);
  }

  var log = document.getElementById('log'); log.textContent = '';
  var changes = data.changes || [];

    log.appendChild(el('h2', null, 'What moved · revision ' + (data.revision || changes.length)));
    for (const ch of changes.slice(0, 12)) {
      const li = el('div', 'rev');
      li.appendChild(el('b', null, 'Revision ' + ch.revision + ' · ' + (ch.at || '').replace('T', ' ').replace('Z', ' UTC') + ' · ' + ch.by + (ch.note ? ' · ' + ch.note : '')));
      if (ch.added && ch.added.length) li.appendChild(el('div', null, 'Added: ' + ch.added.map(function (k) { return k.id + ' ' + k.title + ' (' + k.state + ')'; }).join('; ')));
      if (ch.moved && ch.moved.length) li.appendChild(el('div', null, 'Moved: ' + ch.moved.map(function (k) { return k.id + ' ' + k.from + ' → ' + k.to; }).join('; ')));
      if (ch.removed && ch.removed.length) li.appendChild(el('div', null, 'Removed: ' + ch.removed.map(function (k) { return k.id + ' ' + k.title; }).join('; ')));

      log.appendChild(li);

  }

});
</script>
</body>
</html>
