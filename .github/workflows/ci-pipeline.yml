name: CI Pipeline

# One pipeline: check the site, tag the release, then deploy — so the deploy
# always happens after the tag.
#
# Since v1.0.0 the version is DECLARED, not incremented. Every change to the
# site ships as a release someone wrote notes for (`node scripts/site/release.mjs
# <version> "<title>"`), so CI has nothing to bump: it checks that the version in
# the pages, in site/versions/index.json and in riskmandate_ai/version all agree,
# tags that commit v<version> if the tag does not exist yet, and deploys.
#
# There is also no build step and no vault in the path: site/ is what gets
# served, byte for byte. The only thing CI asks of it is that its generated
# files (the markdown twins, sitemap, llms.txt, 404) are current.
on:
  push:
    branches:
      - qa
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write     # push the release tag
  pages   : write     # deploy to GitHub Pages
  id-token: write     # deploy to GitHub Pages

# One Pages deploy at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Site checks
        run: node --test tests/site/*.mjs

      - name: Generated files are current
        run: node scripts/site/generate.mjs --check

      - name: Shared modules are in step across every page
        run: node scripts/site/sync-modules.mjs --check

      # The Lab's PDF editions are the only artefacts here that somebody may
      # already have been sent, so a missing or altered file is a broken promise
      # rather than a stale build. This checks every digest in the register.
      - name: Lab editions are present and unaltered
        run: node scripts/site/render-lab-pdfs.mjs --check

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag names the commit each release was built from — which is what
      # site/versions/index.json points at. Already tagged is not a failure:
      # several pushes can land on one release while the notes are edited.
      - name: Tag this commit with the declared version
        run: |
          VERSION=$(node -p "require('./site/versions/index.json').latest")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already tagged — nothing to do."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

  build:
    name: Package site
    runs-on: ubuntu-latest
    # After the tag, always — a deploy that beat its own tag would leave the
    # live site claiming a version with nothing to resolve it to. `tag` is
    # skipped on manual dispatch, which is not a reason to skip the deploy.
    needs: [check, tag]
    if: always() && needs.check.result == 'success' && needs.tag.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url : ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
