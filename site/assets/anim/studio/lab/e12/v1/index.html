  function build(S) {

    place(core, R.authorised, -2.2, 2 * Math.PI - 1.2)
    var gap = .3, open = .9, per = (2 * Math.PI - gap * (groups.length - 1) - open) / ex.length, a = -2.17, arcs = el('g', {}, svg)
    groups.forEach(function (g) {

      var rr = 176, p0 = [CX + rr * Math.cos(a0 + .04), CY + rr * Math.sin(a0 + .04)], p1 = [CX + rr * Math.cos(a - .04), CY + rr * Math.sin(a - .04)]
      el('path', { d: 'M' + p0[0] + ' ' + p0[1] + 'A' + rr + ' ' + rr + ' 0 ' + (a - a0 > Math.PI ? 1 : 0) + ' 1 ' + p1[0] + ' ' + p1[1], fill: 'none', stroke: 'var(--agent)', 'stroke-width': 4, 'stroke-linecap': 'round' }, arcs)
      var m = (a0 + a) / 2; if (Math.cos(m) > .9) m = a0 - .02
      var lr = Math.cos(m) < -.9 ? 186 : 200, lx = CX + lr * Math.cos(m), ly = CY + lr * Math.sin(m) + (Math.cos(m) < -.9 ? 36 : 7)

    var byCap = {}
    dots.forEach(function (d) {
      var col = d.r.mandate_stance === 'authorised' ? 'var(--head)' : 'var(--agent)', g = el('g', {}, svg), lit = el('g', {}, g)
      glyph(lit, d.r.barrier_kind, d.x, d.y, col)                      // as E02 v3 ended: each dot in its barrier kind's glyph
      var side = d.x >= CX, tx = { x: d.x + (side ? 22 : -22), y: d.y + 7, 'text-anchor': side ? 'start' : 'end', 'font-size': 20, 'font-weight': 800, 'paint-order': 'stroke', stroke: 'var(--bg)', 'stroke-width': 5 }

    S.$('hD').style.opacity = k(18.5); B.dg.style.opacity = k(18.5)
    B.dl.forEach(function (o, i) {
      var a = LAT[i], hit = a + 1.3
      o.g.style.opacity = k(a, .4)
      o.path.setAttribute('stroke-dashoffset', o.L * (1 - S.seg(t, a + .3, hit)))
      o.w.setAttribute('transform', 'translate(' + (3 * Math.sin(Math.PI * S.seg(t, hit, hit + .3))) + ' 0)')

    var s = 'Claude Code, confirmations on, as E02 ended: of the excess ' + D.excess + ', ' + D.unbounded_excess + ' are bounded by nothing. No row is behind a boundary.'
