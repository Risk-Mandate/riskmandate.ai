<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Behaviour Policy — vault app</title>
<!--
  The Agent Behaviour Policy, delivered as a vault app. v3.

  One file. Nothing external: no fonts, no CDNs, no analytics, no <link href> or
  <script src> against vault paths — the authoring contract for a vault app, because
  this page runs inside a sandboxed frame from an opaque origin.

  Data comes from the vault itself, over the window.sg bridge (sg.vfs.readText) when
  the vault host is present, and from same-origin fetches when served from a static copy.
  A data vault carries no fallback: the loader fetches this renderer and boots it against
  the vault's own files.

  It is written for the person who was HANDED this vault. The shape is a left navigation —
  Start here, then the record (the ABP, the grant, the delta, what follows), then what you
  do with it (correct the mandate, give it to the agent, build a grant, authorise it), then
  what you hold (the licence, your keys, the history, the download). Every view names the
  file it is, and shows it.

  Two things the files do not carry, computed here: a correction (move a capability, the
  delta recomputes with abp.delta/v1 semantics) and a projection per audience (who you are
  decides which of the same facts you are shown). The app writes nothing, by declaration.

  No score is computed or rendered anywhere in this file, and there is no field for one.
-->
<style>
:root{
  --bg:#F7F6F2; --bg2:#EFEDE7; --card:#FFFFFF; --ink:#0D0D0C; --text:#1A1917; --muted:#4A4845; --faint:#8A8780; --border:#E2DFD8;
  --green:#1A7F5A; --green-2:#22c55e; --greenBg:#EBF5F0; --gold:#B45309; --red:#C0392B; --blue:#1D4ED8; --amber:#D98C3F;
  --fg:#F7F6F2; --fg-2:rgba(247,246,242,.6); --fg-3:rgba(247,246,242,.4);
  --line-d:rgba(247,246,242,.10); --line-d2:rgba(247,246,242,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px; --rail-w:250px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3{margin:0;line-height:1.14;letter-spacing:-.02em}
h1{font-size:clamp(25px,3.4vw,38px);font-weight:800}
h2{font-size:clamp(18px,2.3vw,24px);font-weight:700}
h3{font-size:15.5px;font-weight:700}
p{margin:0}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--fg);border-bottom:1px solid var(--line-d)}
.top .bar{display:flex;align-items:center;gap:14px;min-height:52px;padding:6px max(16px,env(safe-area-inset-left));flex-wrap:wrap}
.seal{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--fg);white-space:nowrap}
.seal svg{width:24px;height:24px;display:block}
.seal em{font-style:normal;color:var(--fg-2);font-weight:500;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver{font-family:var(--mono);font-size:11px;color:var(--fg-2);border:1px solid var(--line-d2);border-radius:6px;padding:4px 7px;background:none;cursor:pointer}
.ver:hover{color:var(--fg)}
.src{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);letter-spacing:.04em}
.navtoggle{display:none;background:none;border:1px solid var(--line-d2);color:var(--fg);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}

/* the shell: rail + pane */
.shell{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:calc(100vh - 52px);align-items:start}
.rail{position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto;background:var(--ink);color:var(--fg);padding:18px 0 30px}
.rail .home{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-weight:700;font-size:14.5px;padding:8px 22px 12px;cursor:pointer}
.rail .home span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--fg-3);text-transform:uppercase;margin-top:2px;font-weight:400}
.rgroup{padding:12px 0 0}
.rgroup h4{margin:0 0 4px;padding:0 22px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--fg-2);font:inherit;font-size:13.5px;padding:6px 22px;cursor:pointer;line-height:1.3}
.nav:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.nav.on{background:rgba(255,255,255,.08);border-left-color:var(--green-2);color:var(--fg);font-weight:600}
.nav .f{grid-column:1;font-family:var(--mono);font-size:9.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.nav .b{grid-column:2;grid-row:1;font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--fg-2)}
.nav .b.open{background:rgba(242,193,78,.18);color:#F2C14E}
.nav > :first-child{grid-column:1;grid-row:1}
.nav .b.open{background:rgba(242,193,78,.18);color:#F2C14E}
.rail .note{margin:16px 22px 0;padding-top:12px;border-top:1px solid var(--line-d);font-size:11.5px;line-height:1.5;color:var(--fg-3)}
.pane{min-width:0;padding:30px max(18px,env(safe-area-inset-left)) 60px;max-width:1080px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .navtoggle{display:inline-block;margin-left:auto}
  .rail{position:static;max-height:none;display:none}
  .rail.open{display:block}
  .top .who{margin-left:0}
  .pane{padding:22px 16px 48px}
}

/* generic blocks (shared with the previous renderer) */
.head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.head p{color:var(--muted);max-width:74ch;margin-top:8px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--border);color:var(--muted)}
.chip.template{color:var(--gold);background:#FDF6EC;border-color:rgba(180,83,9,.3)}
.chip.corrected,.chip.licensed{color:var(--green);background:var(--greenBg);border-color:rgba(26,127,90,.3)}
.chip.draft{color:var(--blue);background:#EEF2FF;border-color:rgba(29,78,216,.25)}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px}
.panel h3{margin-bottom:10px}
.panel p,.panel li{color:var(--muted);font-size:14px}
.panel ul{margin:8px 0 0;padding-left:18px}
.panel.open{border-color:rgba(180,83,9,.4)}
.notice{background:var(--greenBg);border:1px solid rgba(26,127,90,.25);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--text);margin-top:16px}
.notice b{color:var(--green)}
.warn{background:#FBEDEA;border:1px solid rgba(192,57,43,.25);border-radius:var(--r);padding:14px 16px;font-size:13.5px;color:var(--text)}
.sub{font-size:13px;color:var(--muted);margin-top:14px}

/* the file strip on every record view */
.filestrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 14px;margin-top:18px;font-size:12.5px}
.filestrip .fn{font-family:var(--mono);font-weight:700;color:var(--text)}
.filestrip .fm{color:var(--faint);font-family:var(--mono);font-size:11px}
.filestrip .btn{margin-left:auto}

/* start here hero */
.hero{background:var(--ink);color:var(--fg);border-radius:14px;padding:32px 32px 28px;margin-bottom:20px}
.hero .tag{color:var(--green-2)}
.hero h1{color:var(--fg);max-width:20ch}
.hero p{color:var(--fg-2);max-width:66ch;margin-top:12px;font-size:15.5px}
.hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .chip{background:rgba(255,255,255,.08);border-color:var(--line-d2);color:var(--fg)}
.hero .chip.open{color:#F2C14E;border-color:rgba(242,193,78,.5);cursor:pointer}
.hero .chip.template{color:#F0C27A;border-color:rgba(240,194,122,.4)}
.hero .chip.licensed{color:#7EE0B4;border-color:rgba(126,224,180,.4)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.step{display:block;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--line-d2);border-radius:var(--r);padding:14px 16px;color:var(--fg);font:inherit;cursor:pointer}
.step:hover{background:rgba(255,255,255,.1)}
.step .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--green-2)}
.step b{display:block;font-size:15px;margin-top:4px}
.step span{display:block;font-size:13px;color:var(--fg-2);margin-top:3px;line-height:1.45}

/* audiences */
.auds{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.aud{display:block;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;color:var(--text)}
.aud:hover{border-color:var(--green)}
.aud b{display:block;font-size:15px}
.aud .r{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.aud p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}

/* the map (inline SVG) */
.map{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px 8px;margin-top:16px}
.map svg{width:100%;height:auto;display:block}
.map .cap{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:8px 4px 6px}
.flow{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}

/* do / don't */
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:820px){.dodont{grid-template-columns:1fr}}
.dd{border-radius:14px;padding:18px 20px;border:1px solid var(--border);background:var(--card)}
.dd.do{border-top:4px solid var(--green)} .dd.dont{border-top:4px solid var(--red)}
.dd h3{font-size:19px;letter-spacing:-.02em}
.dd h3 b{font-size:28px;font-weight:800;margin-right:8px}
.dd.do h3 b{color:var(--green)} .dd.dont h3 b{color:var(--red)}
.dd p{color:var(--muted);font-size:13px;margin-top:4px}
.dd ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.dd li{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:3px 12px;align-items:center;font-size:13px;padding:8px 11px;border-radius:var(--r-sm);background:var(--bg)}
.dd li .mono{grid-column:1;grid-row:1;font-size:11.5px;color:var(--text)}
.dd li .gl{grid-column:1 / -1;grid-row:2;color:var(--muted);font-size:12.5px;line-height:1.4}
.dd li .enf,.dd li .why{grid-column:2;grid-row:1;justify-self:end}
.dd li .why{font-size:11px;color:var(--muted);white-space:nowrap}
.dd .enf{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.dd .enf.boundary{color:var(--green);background:var(--greenBg);border-color:rgba(26,127,90,.3)}
.dd .enf.setting{color:var(--gold);background:#FDF6EC;border-color:rgba(180,83,9,.3)}
.dd .enf.none,.dd .enf.expectation{color:var(--red);background:#FBEDEA;border-color:rgba(192,57,43,.3)}
.dd .sum{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.dd .sum b{color:var(--text)}

/* the card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 26px}
.card .org{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
@media (max-width:600px){.counts{grid-template-columns:1fr 1fr}}
.count{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;background:var(--bg)}
.count b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.count span{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3}
.count.ex b{color:var(--red)} .count.ok b{color:var(--green)} .count.un b{color:var(--gold)}
.rowsline{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:10px}
.noscore{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.noscore b{color:var(--text)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
tr:last-child td{border-bottom:0}
td.k{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.m{color:var(--muted)}
.g{font-family:var(--mono);white-space:nowrap}
.g.none{color:var(--red)} .g.expectation{color:var(--amber)} .g.setting{color:var(--gold)} .g.boundary{color:var(--green);font-weight:700}
.ev{font-family:var(--mono);font-size:11.5px;color:var(--muted)} .ev.m{color:var(--green)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;border-radius:999px;padding:2px 8px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.want{color:var(--green);background:var(--greenBg);border-color:rgba(26,127,90,.3)}
.pill.refused{color:var(--red);background:#FBEDEA;border-color:rgba(192,57,43,.3)}
.pill.unstated{color:var(--gold);background:#FDF6EC;border-color:rgba(180,83,9,.3)}
.pill.mat{color:var(--muted)}.pill.mat.mixed,.pill.mat.third_party{color:var(--red);border-color:rgba(192,57,43,.3)}.pill.mat.own{color:var(--green);border-color:rgba(26,127,90,.3)}
.pill.open{color:var(--gold);background:#FDF6EC;border-color:rgba(180,83,9,.3)}
.pill.kind{color:var(--blue);background:#EEF2FF;border-color:rgba(29,78,216,.2)}

/* consequences */
.cons{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.con{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;border-left:3px solid var(--border)}
.con.open{border-left-color:var(--gold)}
.con .st{font-size:15px;font-weight:600;color:var(--text)}
.con .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.con .req{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px}
.con .req b{color:var(--text)}
.con .lk{font-size:12px;color:var(--muted);margin-top:6px}
.con .lk a{color:var(--green)}
.con .q{font-size:12.5px;color:var(--gold);margin-top:6px}

/* correction (mandate) */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{background:var(--card);border:0;font:inherit;font-size:11.5px;padding:5px 10px;cursor:pointer;color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on.want{background:var(--greenBg);color:var(--green);font-weight:700}
.seg button.on.refused{background:#FBEDEA;color:var(--red);font-weight:700}
.seg button.on.unstated{background:#FDF6EC;color:var(--gold);font-weight:700}
.sticky{position:sticky;top:60px;z-index:5;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0}
.sticky b{font-size:17px}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--green)}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.p:hover{background:#16704f}
.btn.s{font-size:12px;padding:6px 11px}
textarea{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;background:var(--bg);color:var(--text);resize:vertical}
pre{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-word}

/* give it to the agent */
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media (max-width:820px){.ways{grid-template-columns:1fr}}
.way{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.way .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--green)}
.way h3{font-size:16px}
.way p{font-size:13px;color:var(--muted);flex:1 1 auto}
details{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-top:10px}
summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
summary .mono{color:var(--green)} summary .where{font-weight:400;font-size:12.5px;color:var(--muted)}
details .body{padding:0 16px 16px}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.toast{font-family:var(--mono);font-size:11px;color:var(--green)}

/* keys */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media (max-width:760px){.keys{grid-template-columns:1fr}}
.keycard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.keycard.read{border-top:4px solid var(--green)} .keycard.write{border-top:4px solid var(--ink)}
.keycard h3{font-size:16px} .keycard p{font-size:13.5px;color:var(--muted);margin-top:6px}
.keycard .id{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;margin-top:10px;color:var(--text);word-break:break-all}

/* history */
.hist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.h{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;font-size:13px}
.h .v{font-family:var(--mono);font-weight:700;color:var(--green)}
.h .d{color:var(--muted)}
.foot{border-top:1px solid var(--border);padding:24px 0 40px;font-size:12.5px;color:var(--faint);line-height:1.6}
.foot b{color:var(--muted)}
#loading{padding:40px 0;color:var(--muted);font-family:var(--mono);font-size:12px}
@media print{
  .top{position:static}.rail{display:block!important;position:static;max-height:none}.navtoggle,.src{display:none}
  .shell{grid-template-columns:1fr}.pane{max-width:none}
  .view{page-break-before:always}.view:first-child{page-break-before:auto}
  .sticky{position:static}textarea{min-height:0;height:auto}.flow{animation:none}
  .hero,.top{background:#fff;color:#000}.hero h1,.hero p{color:#000}.rail{background:#fff;color:#000}.nav,.rgroup h4,.rail .home{color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="seal" aria-label="RiskMandate">

  { items: [['start', 'Start here', null]] },
  { title: 'The record', items: [['abp', 'The ABP', 'AGENT-BEHAVIOUR-POLICY.md'], ['grant', 'Evidence', 'GRANT.md'], ['delta', 'The gap', 'DELTA.md'], ['consequences', 'What follows', 'CONSEQUENCES.md']] },
  { title: 'What you do', items: [['mandate', 'Customise', 'MANDATE.md'], ['deploy', 'Use it', 'AGENTS.md'], ['build', 'Build it', 'MAP-A-GRANT.md'], ['authorise', 'Authorise it', 'LICENCE-TO-OPERATE.md']] },
  { title: 'What you hold', items: [['licence', 'Licence', 'LICENCE.md'], ['keys', 'Your keys', null], ['keep', 'Keep it', 'history/'], ['download', 'Download', 'dist/']] },
];
const BUILDERS = { start: viewStart, abp: viewAbp, grant: viewGrant, delta: viewDelta, consequences: viewConsequences, mandate: viewMandate, deploy: viewDeploy, build: viewBuild, authorise: viewAuthorise, licence: viewLicence, keys: viewKeys, keep: viewKeep, download: viewDownload };
let current = 'start';
function buildRail() {
  const rail = document.getElementById('rail'); rail.textContent = '';
  rail.append(h('button', { class: 'home', type: 'button', on: { click: () => show('start') } }, [D.vault.title, h('span', null, D.grant.id)]));
  for (const g of GROUPS) { const grp = h('div', { class: 'rgroup' }); if (g.title) grp.append(h('h4', null, g.title));
    for (const [id, label, file] of g.items) {
      if (id === 'consequences' && !consList().length) continue;
      const badge = id === 'consequences' && consList().length ? h('span', { class: 'b open' }, String(consList().length))
        : id === 'grant' && research().length ? h('span', { class: 'b open' }, research().length + ' open') : null;
      grp.append(h('button', { class: 'nav' + (id === current ? ' on' : ''), type: 'button', 'data-view': id, on: { click: () => { show(id); document.getElementById('rail').classList.remove('open'); } } }, [h('span', null, label), badge, file ? h('span', { class: 'f' }, file) : null])); }
    rail.append(grp); }
  rail.append(h('p', { class: 'note' }, 'Delivered as an encrypted vault. This page is a little HTML on top of the files beside it; anyone with the read key can check every number here against the bytes it came from.'));
}
function appendAll(parent, nodes) { for (const node of [].concat(nodes)) { if (node == null) continue; if (Array.isArray(node)) { appendAll(parent, node); continue; } parent.appendChild(typeof node === 'string' ? document.createTextNode(node) : node); } }
function render(name) { const view = document.getElementById('view'); view.textContent = ''; view.className = 'view'; appendAll(view, BUILDERS[name]()); }
function show(name) { current = name;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.view === name));
  render(name); window.scrollTo({ top: 0 }); }
function ready() { try { window.parent && window.parent.postMessage({ type: 'sg-app-ready' }, '*'); } catch (e) {} }

load().then(data => {
  D = data;
  CAP = Object.fromEntries(D.capabilities.capabilities.map(c => [c.id, c]));
  UNDO_RANK = Object.fromEntries(D.undo.order.map((u, i) => [u, i]));
  MEASURED = new Set(D.tiers.counted_as_measured);
  MANDATE = JSON.parse(JSON.stringify(D.mandate));
  STD = {}; for (const key of ['gdpr', 'euaiact', 'attack']) { const g = D[key]; if (g) for (const n of g.nodes || []) STD[n.id] = n; }
  buildRail();
  const last = (D.history.entries || []).slice(-1)[0];
  document.getElementById('ver').textContent = 'v' + (last ? last.v : 1) + ' · ' + D.vault.as_at;
  document.getElementById('ver').addEventListener('click', () => show('keep'));
  const via = window.ABP_LOADER ? ' · app via ' + window.ABP_LOADER.source : '';
  document.getElementById('src').textContent = (window.sg && sg.vfs ? 'live from the vault' : 'static copy') + via;
  document.getElementById('navtoggle').addEventListener('click', () => document.getElementById('rail').classList.toggle('open'));
  document.getElementById('foot').append(h('b', null, 'RiskMandate — Agent Behaviour Policy, delivered as a vault. '), 'Grant ' + D.grant.profile_version + ' · mandate ' + D.mandate.authored + ' · vocabulary abp.sgit.ai ' + D.vault.vocabulary_version + ' · as at ' + D.vault.as_at + '. It describes and it does not judge, so it carries no score. Not a compliance assessment, a certification, an audit or a security review of any named product. ', h('a', { href: 'https://riskmandate.ai/abp.html' }, 'riskmandate.ai'));
  show('start');
  ready();
}).catch(err => {
  console.error('[abp-vault]', err);
  const msg = String(err && err.message || err);
  const view = document.getElementById('view'); view.textContent = '';
  if (/vault\.json/.test(msg)) {
    view.append(h('div', { class: 'panel' }, [h('h3', null, 'This is the renderer, not a policy.'), h('p', null, 'It is the code every behaviour-policy vault loads; opened on its own there is no vault.json beside it, so there is nothing to show. Open an application vault — its index.html is a loader that fetches this file and boots it against that vault’s data.'), h('p', { class: 'sub' }, ['The directory of application vaults is at ', h('a', { href: 'https://riskmandate.ai/agent-behaviour-policy.html' }, 'riskmandate.ai/agent-behaviour-policy')])]));
  } else { view.append(h('div', { class: 'panel' }, [h('h3', null, 'Could not read the vault'), h('p', null, msg)])); }
  document.getElementById('src').textContent = 'error';
  ready();
});
window.addEventListener('beforeprint', () => { if (D) { const view = document.getElementById('view'); view.textContent = ''; for (const [id] of Object.entries(BUILDERS)) { const sec = h('section', { class: 'view' }); appendAll(sec, BUILDERS[id]()); view.appendChild(sec); } } });
</script>
</body>
</html>
